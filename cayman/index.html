<script>
$(document).ready(function() {
  function initGallery() {
    let rowHeight = 350; // default for desktop
    let margins = 100;   // keep 100 for desktop

    if (window.innerWidth <= 800) { // mobile
      rowHeight = 250; // slightly smaller row height for better fit
      margins = 70;    // smaller gaps on mobile
    }

    $("#gallery").justifiedGallery('destroy'); // remove previous instance
    $("#gallery").justifiedGallery({
      rowHeight: rowHeight,
      margins: margins,
      lastRow: 'justify',
      captions: false
    });
  }

  initGallery(); // initialize on page load

  $(window).resize(function() {
    initGallery(); // reinitialize on resize
  });
});
</script>

<script>
const photos = document.querySelectorAll(".photo");
const caption = document.getElementById("caption");

photos.forEach(photo => {
  photo.addEventListener("click", () => {

    if (photo.classList.contains("active")) {
      photo.classList.remove("active");
      photos.forEach(p => p.classList.remove("hidden"));
      caption.textContent = "";
      return;
    }

    photos.forEach(p => {
      p.classList.remove("active");
      p.classList.add("hidden");
    });

    photo.classList.remove("hidden");
    photo.classList.add("active");
    caption.textContent = photo.dataset.caption;
  });
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    photos.forEach(p => {
      p.classList.remove("active");
      p.classList.remove("hidden");
    });
    caption.textContent = "";
  }
});
</script>
